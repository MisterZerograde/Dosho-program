name: Build & Publish App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run create-icons

      - name: Prepare MT5 bridge
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force mt5_bridge/dist | Out-Null
          $found = $false
          try {
            gh release download latest --pattern mt5_bridge.exe --dir mt5_bridge/dist
            $found = Test-Path "mt5_bridge/dist/mt5_bridge.exe"
          } catch {}
          if (-not $found) {
            Write-Host "No bridge release found — building without bundled bridge"
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $pkg.build.PSObject.Properties.Remove('extraResources')
            $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json -Encoding utf8
          }

      - name: Build & publish installer
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
